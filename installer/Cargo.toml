[package]
name = "obelisk-access-installer"
version = "1.0.0"
edition = "2021"
description = "Installer for the ObeliskAccess accessibility mod for Across the Obelisk"

[[bin]]
name = "ObeliskAccessInstaller"
path = "src/main.rs"

[features]
default = ["require-admin"]
# Embeds the UAC-elevation manifest (app.rc/app.manifest) into the built binary.
# Off by default for `cargo test`: the manifest applies to every binary compiled
# from this crate, including the test harness, which would then need an
# elevated shell just to launch. Use `cargo test --no-default-features`.
require-admin = []

[dependencies]
wxdragon = "0.9"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
regex = "1"
rfd = "0.15"
semver = "1"
pelite = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
