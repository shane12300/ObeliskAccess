[package]
name = "obelisk-access-installer"
version = "1.0.0"
edition = "2021"
description = "Installer for the ObeliskAccess accessibility mod for Across the Obelisk"

[[bin]]
name = "ObeliskAccessInstaller"
path = "src/main.rs"

# Console-subsystem twin for terminal use. The GUI image above cannot serve as a CLI: shells do
# not wait for a GUI-subsystem process, so its --cli mode reads EOF and exits. See src/cli_main.rs.
[[bin]]
name = "ObeliskAccessInstaller-cli"
path = "src/cli_main.rs"

[dependencies]
wxdragon = "0.9"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
regex = "1"
rfd = "0.15"
semver = "1"
pelite = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_Shell", "Win32_Foundation"] }
winreg = "0.55"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
